# Include inside UnDoubt's dedicated server block. Do not use a shared
# server-wide /socket.io/ location for several unrelated applications.
# No trailing URI on proxy_pass: preserve /api/ and /socket.io/ upstream.
location ^~ /api/ {
    proxy_pass http://undoubt_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
    proxy_read_timeout 60s;
}

location ^~ /socket.io/ {
    proxy_pass http://undoubt_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $undoubt_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    # Greater than the current 25s heartbeat interval + 20s timeout.
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
}

location ^~ /health/ {
    proxy_pass http://undoubt_backend;
    proxy_set_header Host $host;
    proxy_cache off;
    proxy_read_timeout 20s;
}

location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}
