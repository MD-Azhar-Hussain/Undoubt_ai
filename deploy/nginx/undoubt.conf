# Install in Nginx's http context (usually sites-enabled or conf.d).
# Replace example hostname and certificate paths with campus-provided values.
map $http_upgrade $undoubt_connection_upgrade {
    default upgrade;
    '' close;
}

upstream undoubt_backend {
    # Keep a single upstream until distributed broadcasts/limits are implemented.
    server 127.0.0.1:6108;
}

# Avoid logging socket session query strings, credentials, or request bodies.
log_format undoubt '$time_iso8601 $request_method $uri $status '
                   'upstream=$upstream_status duration=$request_time '
                   'upstream_duration=$upstream_response_time';

server {
    listen 80;
    server_name undoubt.example.edu;
    return 308 https://undoubt.example.edu$request_uri;
}

server {
    listen 443 ssl;
    server_name undoubt.example.edu;
    ssl_certificate /etc/letsencrypt/live/undoubt.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/undoubt.example.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/undoubt/frontend/dist;
    client_max_body_size 16k;
    access_log /var/log/nginx/undoubt-access.log undoubt;
    error_log /var/log/nginx/undoubt-error.log warn;
    include /etc/nginx/snippets/undoubt-locations.conf;
}
